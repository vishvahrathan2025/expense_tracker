<!DOCTYPE html>
<html lang="en">
<head>
    <title>Expense Tracker</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="p-4">
    <div class="container">
        <h1 class="text-center">💰 Expense Tracker</h1>
        <h4 class="mt-3">Total Spent: ₹{{ total }}</h4>
        <a href="{% url 'add_expense' %}" class="btn btn-success mb-3">➕ Add Expense</a>


        <table class="table table-striped mt-4">
            <thead>
                <tr>
                    <th>Title</th>
                    <th>Amount</th>
                    <th>Category</th>
                    <th>Date</th>
                </tr>
            </thead>
            <tbody>
                {% for exp in expenses %}
                <tr>
                    <td>{{ exp.title }}</td>
                    <td>{{ exp.amount }}</td>
                    <td>{{ exp.category }}</td>
                    <td>{{ exp.date }}</td>
                </tr>
                {% empty %}
                <tr><td colspan="4" class="text-center">No expenses yet.</td></tr>
                {% endfor %}
                <a href="{% url 'logout' %}">Logout</a>

            </tbody>
        </table>
    </div>
</body>
</html>
