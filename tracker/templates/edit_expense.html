{% extends "base.html" %}

{% block title %}Edit Expense{% endblock %}

{% block content %}

<div class="row justify-content-center">

    <div class="col-lg-7">

        <div class="card shadow">

            <div class="card-header bg-warning text-dark">

                <h3 class="mb-0">
                    ✏️ Edit Expense
                </h3>

            </div>

            <div class="card-body">

                <form method="POST">

                    {% csrf_token %}

                    <div class="mb-3">

                        <label class="form-label">
                            Title
                        </label>

                        {{ form.title }}

                    </div>

                    <div class="mb-3">

                        <label class="form-label">
                            Amount (₹)
                        </label>

                        {{ form.amount }}

                    </div>

                    <div class="mb-3">

                        <label class="form-label">
                            Category
                        </label>

                        {{ form.category }}

                    </div>

                    <div class="mb-3">

                        <label class="form-label">
                            Date
                        </label>

                        {{ form.date }}

                    </div>

                    <div class="mb-3">

                        <label class="form-label">
                            Description
                        </label>

                        {{ form.description }}

                    </div>

                    <div class="d-flex justify-content-between">

                        <a
                            href="{% url 'home' %}"
                            class="btn btn-secondary">

                            ← Cancel

                        </a>

                        <button
                            type="submit"
                            class="btn btn-warning">

                            💾 Update Expense

                        </button>

                    </div>

                </form>

            </div>

        </div>

    </div>

</div>

{% endblock %}
