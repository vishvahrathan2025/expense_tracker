{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>{% block title %}Expense Tracker{% endblock %}</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body class="bg-light">

<div class="container-fluid">
    <div class="row">

        <!-- Sidebar -->
        <div class="col-md-2 bg-primary text-white min-vh-100 p-3">

            <h3 class="text-center mb-4">
                💰 Expense Tracker
            </h3>

            <hr>

            <a href="{% url 'home' %}" class="btn btn-primary w-100 text-start mb-2">
                <i class="fas fa-chart-line"></i>
                Dashboard
            </a>

            <a href="{% url 'add_expense' %}" class="btn btn-primary w-100 text-start mb-2">
                <i class="fas fa-plus-circle"></i>
                Add Expense
            </a>

            <a href="{% url 'income' %}" class="btn btn-primary w-100 text-start mb-2">
                <i class="fas fa-wallet"></i>
                Income
            </a>

            <a href="{% url 'budget' %}" class="btn btn-primary w-100 text-start mb-2">
                <i class="fas fa-bullseye"></i>
                Budget
            </a>

            <hr>

            <form action="{% url 'logout' %}" method="post">
                {% csrf_token %}
                <button type="submit" class="btn btn-danger w-100">
                    <i class="fas fa-sign-out-alt"></i>
                    Logout
                </button>
            </form>

        </div>

        <!-- Main Content -->
        <div class="col-md-10 p-4">

            {% if messages %}
                {% for message in messages %}
                    <div class="alert alert-success alert-dismissible fade show">
                        {{ message }}
                        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                    </div>
                {% endfor %}
            {% endif %}

            {% block content %}
            {% endblock %}

        </div>

    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
