<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Expense</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Optional Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #74ABE2, #5563DE);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: fadeIn 0.8s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .card {
            border-radius: 20px;
            background: #fff;
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 550px;
            overflow: hidden;
        }

        .card-header {
            background: linear-gradient(135deg, #5563DE, #74ABE2);
            color: white;
            font-weight: 600;
            text-align: center;
            padding: 1.2rem;
            font-size: 1.5rem;
        }

        .form-control, .form-select {
            border-radius: 12px;
            padding: 10px;
        }

        .btn-primary {
            background-color: #5563DE;
            border: none;
            border-radius: 12px;
            transition: 0.3s ease;
        }
        .btn-primary:hover {
            background-color: #3F4CC8;
        }

        .btn-outline-secondary {
            border-radius: 12px;
        }

        .fade-alert {
            animation: slideDown 0.5s ease forwards;
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-15px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>

<body>

<div class="container px-3">
    <div class="card shadow-lg">
        <div class="card-header">
            💰 Add New Expense
        </div>
        <div class="card-body p-4">

            <!-- Success Message -->
            {% if messages %}
            {% for message in messages %}
            <div class="alert alert-success fade-alert" role="alert">
                {{ message }}
            </div>
            {% endfor %}
            {% endif %}

            <form method="POST" novalidate>
                {% csrf_token %}

                <!-- Title -->
                <div class="mb-3">
                    <label for="title" class="form-label fw-semibold">Expense Title</label>
                    <input type="text" id="title" name="title" class="form-control"
                           placeholder="e.g. Groceries, Electricity Bill" required>
                </div>

                <!-- Amount -->
                <div class="mb-3">
                    <label for="amount" class="form-label fw-semibold">Amount (₹)</label>
                    <input type="number" id="amount" name="amount" class="form-control"
                           placeholder="e.g. 1200" min="0" step="0.01" required>
                </div>

                <!-- Category -->
                <div class="mb-3">
                    <label for="category" class="form-label fw-semibold">Category</label>
                    <select id="category" name="category" class="form-select" required>
                        <option value="">Select a category</option>
                        <option value="Food">🍔 Food</option>
                        <option value="Travel">🚗 Travel</option>
                        <option value="Shopping">🛍️ Shopping</option>
                        <option value="Bills">💡 Bills</option>
                        <option value="Health">💊 Health</option>
                        <option value="Entertainment">🎬 Entertainment</option>
                        <option value="Other">📦 Other</option>
                    </select>
                </div>

                <!-- Date -->
                <div class="mb-3">
                    <label for="date" class="form-label fw-semibold">Date</label>
                    <input type="date" id="date" name="date" class="form-control" required>
                </div>

                <!-- Description -->
                <div class="mb-3">
                    <label for="description" class="form-label fw-semibold">Description</label>
                    <textarea id="description" name="description" rows="3" class="form-control"
                              placeholder="Add extra details (optional)..."></textarea>
                </div>

                <!-- Buttons -->
                <div class="d-flex justify-content-between mt-4">
                    <a href="{% url 'home' %}" class="btn btn-outline-secondary px-4">← Back</a>
                    <button type="submit" class="btn btn-primary px-4">Save Expense</button>
                </div>
            </form>
        </div>
    </div>
</div>

<!-- Bootstrap JS (for animations and alert closing) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<!-- Auto-fill today's date -->
<script>
    document.addEventListener('DOMContentLoaded', () => {
        const dateInput = document.getElementById('date');
        if (dateInput && !dateInput.value) {
            const today = new Date().toISOString().split('T')[0];
            dateInput.value = today;
        }
    });
</script>

</body>
</html>
